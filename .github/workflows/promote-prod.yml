# Manual promotion to prod (https://apm.taylorrowser.com) of a recorded, health-checked DEV
# RELEASE. Input is a dev release id (from the "Deploy dev" run summary). The reusable
# prod-release.yml resolves its record from S3, checks the dev health check passed, that dev still
# runs it (or that you explicitly chose an older tested release), that the digest matches and the
# commit is on main, then deploys the same artifact without rebuilding and records a prod release.
#
# Gate: workflow_dispatch from main only, plus those checks. No approval gate is claimed: required
# environment reviewers aren't available for this private personal repo's plan (see docs).
# Disabled until bootstrap: needs the repository variable APM_PROD_DEPLOY_ENABLED == 'true'.
name: Promote to prod

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Dev release id, e.g. dev-20261011T120000Z-0123456789ab
        required: true
        type: string
      sha256:
        description: Optional expected artifact sha256 (from the dev run summary)
        required: false
        type: string
      allow_superseded:
        description: Dev has moved past this release and I want this older tested release anyway
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  # Shared with rollback-prod.yml: one prod change at a time, never cancelled mid-flight.
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/prod-release.yml
    permissions:
      contents: read
      actions: read # provenance checks against the CI and deploy runs
      id-token: write
    with:
      mode: promote
      release_id: ${{ inputs.release_id }}
      sha256: ${{ inputs.sha256 }}
      allow_superseded: ${{ inputs.allow_superseded }}
