# PR and main checks: tests, template render + lint, and a reproducible Lambda artifact.
# No cloud access: this workflow never gets AWS credentials or an OIDC token (no id-token
# permission), so ordinary PR checks need no AWS role. Runs on GitHub-hosted runners unless the
# APM_RUNNER variable is set (leave it unset while the repo is in a personal account).
#
# The `build` job builds the PR *head* commit (not the merge ref) so an opted-in preview can deploy
# exactly that sha; deploy-dev.yml and preview.yml download `lambda-<sha>` from here (build once).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs replace each other; main runs all finish (deploy-dev builds on their artifacts).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Runner label in one place: set the APM_RUNNER repository variable to swap runners
    # (e.g. a Blacksmith or Depot label) without editing workflows.
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e . pytest cfn-lint==1.57.2
      - name: Compile
        run: python -m compileall -q apm plugins tests
      - name: Tests
        run: python -m pytest -q tests
      - name: Render and lint templates (prod, dev, preview)
        run: |
          mkdir -p rendered
          apm-admin template --stage prod > rendered/prod.json
          apm-admin template --stage dev --domain dev.apm.example.com > rendered/dev.json
          apm-admin template --stage pr-1 --domain pr-1.preview.apm.example.com \
            --certificate-arn arn:aws:acm:us-east-1:111122223333:certificate/0f0e0d0c-1111-2222-3333-444455556666 \
            > rendered/pr.json
          for s in prod dev pr-1; do apm-admin names --stage "$s"; done
          cfn-lint rendered/*.json infra/github-oidc-bootstrap.yaml

  build:
    needs: test
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Build Lambda artifact
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          apm-admin build --out dist/lambda --git-sha "$SHA"
          # Reproducibility check: a second build from the same tree must be byte-identical.
          apm-admin build --out dist/rebuild --git-sha "$SHA"
          cmp dist/lambda/lambda.zip dist/rebuild/lambda.zip
          apm-admin verify --artifact dist/lambda --git-sha "$SHA"
          {
            echo "### Lambda artifact"
            echo '```json'
            cat dist/lambda/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # deploy-dev.yml (main) and preview.yml (PR head) download this exact artifact (build once).
          # Transport only: dev release records keep the bundle durably in S3.
          name: lambda-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/lambda/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
