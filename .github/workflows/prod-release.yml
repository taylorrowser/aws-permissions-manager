# Reusable prod release workflow: the ONLY workflow that assumes the prod deploy role.
# Called by promote-prod.yml (input: a dev release id) and rollback-prod.yml (input: a prior prod
# release id), and by oidc-claims.yml in `claims` mode to print the exact OIDC subject. Because
# every prod deploy runs this one reviewed file, the OIDC `job_workflow_ref` claim is always
# <owner>/<repo>/.github/workflows/prod-release.yml@refs/heads/main, which the prod role trust
# can require (see infra/github-oidc-bootstrap.yaml and docs/deployment.md).
#
# Flow: resolve (read-only creds) -> validate record, digest, GitHub provenance and ancestry -> deploy the SAME bytes
# (no rebuild) with the prod role -> health check -> write a prod release record.
# Serialization lives in the callers (concurrency group deploy-production, never cancelled).
name: Prod release (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: promote, rollback or claims
        required: true
        type: string
      release_id:
        description: dev release id (promote) or prod release id (rollback)
        required: false
        type: string
        default: ""
      sha256:
        description: optional expected artifact sha256
        required: false
        type: string
        default: ""
      allow_superseded:
        description: promote only; explicitly accept a tested dev release that dev has moved past
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  claims:
    if: inputs.mode == 'claims' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Print the prod OIDC claims (not the token)
        run: |
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          base64 -d <<< "$payload" | jq '{sub, aud, repository, repository_id, repository_owner,
            repository_owner_id, environment, ref, job_workflow_ref, workflow_ref, event_name}' | tee -a "$GITHUB_STEP_SUMMARY"

  resolve:
    if: >-
      inputs.mode != 'claims' && vars.APM_PROD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read # provenance: read CI / deploy runs and download their artifacts
      id-token: write # promote: nonprod release-reader role (read-only); rollback: prod role (reads only here)
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      git_sha: ${{ steps.resolve.outputs.git_sha }}
      sha256: ${{ steps.resolve.outputs.sha256 }}
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      ci_run_url: ${{ steps.resolve.outputs.ci_run_url }}
    env:
      MODE: ${{ inputs.mode }}
      RELEASE_ID: ${{ inputs.release_id }}
      SHA256: ${{ inputs.sha256 }}
      ALLOW_SUPERSEDED: ${{ inputs.allow_superseded }}
      # promote reads the dev release from the nonprod account; rollback reads prod's own records.
      ROLE_ARN: ${{ inputs.mode == 'rollback' && vars.APM_PROD_ROLE_ARN || vars.APM_RELEASE_READER_ROLE_ARN }}
      ACCOUNT: ${{ inputs.mode == 'rollback' && vars.APM_PROD_ACCOUNT_ID || vars.APM_NONPROD_ACCOUNT_ID }}
      AWS_REGION: ${{ inputs.mode == 'rollback' && (vars.APM_PROD_REGION || 'us-east-1') || (vars.APM_NONPROD_REGION || 'us-east-1') }}
    steps:
      - name: Check inputs and configuration
        run: |
          case "$MODE" in
            promote) [[ "$RELEASE_ID" =~ ^dev-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]] || { echo "::error::release_id must be a dev release id (dev-YYYYMMDDTHHMMSSZ-<sha12>)"; exit 1; } ;;
            rollback) [[ "$RELEASE_ID" =~ ^prod-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]] || { echo "::error::release_id must be a prod release id (prod-YYYYMMDDTHHMMSSZ-<sha12>)"; exit 1; } ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac
          [ -z "$SHA256" ] || [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 must be 64 hex characters"; exit 1; }
          [ -n "$ROLE_ARN" ] && [ -n "$ACCOUNT" ] || { echo "::error::role ARN or account variable is empty (see docs/deployment.md)"; exit 1; }

      # Tooling from reviewed main (this run's ref), never from the release being deployed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -e .

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: apm-prod-resolve-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.ACCOUNT }}

      - name: Resolve and verify the recorded artifact
        id: resolve
        run: |
          args=(--mode "$MODE" --release-id "$RELEASE_ID" --account "$ACCOUNT" --region "$AWS_REGION" --out dist/lambda)
          [ -n "$SHA256" ] && args+=(--sha256 "$SHA256")
          [ "$MODE" = promote ] && [ "$ALLOW_SUPERSEDED" = true ] && args+=(--allow-superseded)
          apm-admin release resolve "${args[@]}"

      # S3 records alone are not trusted: code running in the nonprod account (a preview runs PR
      # code there) must never be able to forge a promotable release. Independently confirm with
      # GitHub that the record's CI run is a successful ci.yml push run on main for this exact
      # commit in this repository, that the bundle has the digest that run built (fails closed if
      # the CI artifact expired), and that the dev deploy run recorded this exact release.
      - name: Verify provenance with the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: apm-admin release provenance --mode "$MODE" --record dist/lambda/release.json --repo "$REPO"

      - name: Released commit must be on main
        env:
          GIT_SHA: ${{ steps.resolve.outputs.git_sha }}
        # origin/main comes from the fetch-depth: 0 checkout above (no credentials are persisted,
        # so a `git fetch` here would fail on this private repo).
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo "::error::checkout did not fetch origin/main"; exit 1; }
          git merge-base --is-ancestor "$GIT_SHA" origin/main || {
            echo "::error::${GIT_SHA} is not an ancestor of origin/main"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Run-scoped transport to the deploy job; the durable copy stays in S3.
          name: prod-candidate
          path: dist/lambda/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: resolve
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    environment:
      name: production
      url: https://${{ vars.APM_BASE_DOMAIN || 'apm.taylorrowser.com' }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS prod deploy role
    env:
      MODE: ${{ inputs.mode }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      GIT_SHA: ${{ needs.resolve.outputs.git_sha }}
      SHA256: ${{ needs.resolve.outputs.sha256 }}
      CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
      CI_RUN_URL: ${{ needs.resolve.outputs.ci_run_url }}
      DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DOMAIN: ${{ vars.APM_BASE_DOMAIN || 'apm.taylorrowser.com' }}
      AWS_REGION: ${{ vars.APM_PROD_REGION || 'us-east-1' }}
      ACCOUNT: ${{ vars.APM_PROD_ACCOUNT_ID }}
      ROLE_ARN: ${{ vars.APM_PROD_ROLE_ARN }}
      OWNER_EMAILS: ${{ vars.APM_OWNER_EMAILS }}
      WORKOS_CLIENT_ID: ${{ vars.APM_PROD_WORKOS_CLIENT_ID }}
      ZONE_ID: ${{ vars.APM_PROD_ZONE_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          for v in ACCOUNT ROLE_ARN OWNER_EMAILS WORKOS_CLIENT_ID RELEASE_ID GIT_SHA SHA256 CI_RUN_ID; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::these settings are empty: ${missing[*]} (see docs/deployment.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -e .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-candidate
          path: dist/lambda
      - name: Verify it is the resolved artifact
        run: apm-admin verify --artifact dist/lambda --sha256 "$SHA256" --git-sha "$GIT_SHA"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: apm-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.ACCOUNT }}

      - name: Deploy to prod (same bytes, no rebuild)
        id: deploy
        run: |
          args=()
          [ -n "$ZONE_ID" ] && args+=(--zone-id "$ZONE_ID")
          apm-admin deploy-artifact --stage prod --artifact dist/lambda --git-sha "$GIT_SHA" --sha256 "$SHA256" \
            --account "$ACCOUNT" --region "$AWS_REGION" --domain "$DOMAIN" \
            --owner-email "$OWNER_EMAILS" --workos-client-id "$WORKOS_CLIENT_ID" "${args[@]}"

      - name: Health check
        id: smoke
        continue-on-error: true # recorded either way; the job fails below if it failed
        run: apm-admin smoke --url "https://${DOMAIN}" --attempts 12

      - name: Record prod release
        id: record
        if: always() && steps.deploy.outcome == 'success'
        env:
          HEALTH: ${{ steps.smoke.outcome == 'success' && 'passed' || 'failed' }}
          KIND: ${{ inputs.mode == 'rollback' && 'rollback' || 'promotion' }}
        run: |
          apm-admin release record --stage prod --kind "$KIND" --artifact dist/lambda --git-sha "$GIT_SHA" \
            --sha256 "$SHA256" --health "$HEALTH" --health-url "https://${DOMAIN}/healthz" \
            --ci-run-id "$CI_RUN_ID" --ci-run-url "$CI_RUN_URL" \
            --deploy-run-id "$GITHUB_RUN_ID" --deploy-run-url "$DEPLOY_RUN_URL" \
            --account "$ACCOUNT" --region "$AWS_REGION" --domain "$DOMAIN" --source-release-id "$RELEASE_ID"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          HEALTH: ${{ steps.smoke.outcome }}
          PROD_RELEASE_ID: ${{ steps.record.outputs.release_id }}
        run: |
          {
            echo "### Prod ${MODE}: ${STATUS} (health check: ${HEALTH:-not run})"
            echo "- URL: https://${DOMAIN}"
            echo "- Source release: \`${RELEASE_ID}\`"
            echo "- Commit: \`${GIT_SHA}\`"
            echo "- Artifact sha256: \`${SHA256}\`"
            echo "- Prod release record: \`${PROD_RELEASE_ID:-none}\`"
            echo "- Rollback: run **Rollback prod** with an earlier prod release id whose health check passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the health check failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::prod health check failed after deploying ${RELEASE_ID}; run Rollback prod"
          exit 1
