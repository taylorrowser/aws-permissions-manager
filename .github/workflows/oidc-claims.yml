# Bootstrap helper: prints the GitHub OIDC claims (sub, aud, ...) a job in the chosen environment
# receives, so AWS trust policies are written from the real `sub` instead of an assumed format.
# Repositories created after 2026-07-15 (like this one) or opted in use immutable owner/repo IDs in
# `sub`. The token itself is never printed: only its decoded claims, which are not secret.
# Makes no AWS calls.
name: OIDC claims

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose token to inspect
        required: true
        type: choice
        options: [dev, preview, production]

permissions: {}

jobs:
  claims:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.APM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - name: Print claims (not the token)
        run: |
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${token}"
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          base64 -d <<< "$payload" | jq '{sub, aud, iss, repository, repository_id, repository_owner,
            repository_owner_id, environment, ref, job_workflow_ref, event_name}' | tee -a "$GITHUB_STEP_SUMMARY"
