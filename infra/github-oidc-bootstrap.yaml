# One-time bootstrap for GitHub Actions deploys. NOT applied by CI or by this repo's code: the owner
# reviews it and deploys it by hand, once per account, with an admin login. See docs/deployment.md.
#
#   Nonprod account: AccountKind=nonprod -> apm-github-dev, apm-github-preview, apm-github-release-reader
#   Prod account:    AccountKind=prod    -> apm-github-prod
#
# Trust: each role trusts only GitHub's OIDC provider, audience sts.amazonaws.com, and ONE exact
# `sub` value. Copy the subjects from the "OIDC claims" workflow output (.github/workflows/
# oidc-claims.yml); do not guess the format. This repo was created after 2026-07-15, so its `sub`
# is expected to use immutable IDs (repo:OWNER@OWNER_ID/REPO@REPO_ID:...), but only the printed
# claim is authoritative.
#
# Prod identity: only the reusable .github/workflows/prod-release.yml (called by promote-prod.yml and
# rollback-prod.yml from main) runs in the `production` environment with the prod role. Recommended:
# customize the repo's OIDC subject template to include job_workflow_ref (docs/deployment.md), so
# ProdSubject pins org/repo, environment, workflow file and refs/heads/main in one exact string.
# Optionally also set ProdJobWorkflowRef to require the job_workflow_ref claim directly (fails
# closed if AWS doesn't evaluate that claim: verify with a first run).
#
# Isolation: the preview role can't touch dev or prod names, and the dev role can't touch prod names
# (explicit Deny statements below, on top of name-scoped Allows; tests/test_pipeline.py checks
# them). The release-reader role (nonprod) is read-only on dev release records and bundles and is
# trusted only by the prod identity, so promotion can read the dev release without dev writing to prod.
#
# Caveat: a role that can create the broker role and its inline policy through CloudFormation is
# effectively able to grant itself anything in that account. The scoping below limits accidents and
# keeps dev/preview/prod apart by name; the real isolation is the separate nonprod account and the
# exact-match OIDC subject.
AWSTemplateFormatVersion: "2010-09-09"
Description: apm GitHub Actions OIDC deploy roles (bootstrap, applied manually)

Parameters:
  AccountKind:
    Type: String
    AllowedValues: [nonprod, prod]
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if this account already has the token.actions.githubusercontent.com provider
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of the existing GitHub OIDC provider when CreateOidcProvider is false
  DevSubject:
    Type: String
    Default: ""
    Description: Exact sub claim of a job in environment dev (nonprod only)
  PreviewSubject:
    Type: String
    Default: ""
    Description: Exact sub claim of a job in environment preview (nonprod only)
  ProdSubject:
    Type: String
    Default: ""
    Description: >-
      Exact sub claim of prod-release.yml in environment production (both accounts: prod role, and the
      nonprod release-reader role). Read it with the OIDC claims workflow, environment production.
  ProdJobWorkflowRef:
    Type: String
    Default: ""
    Description: >-
      Optional. Exact job_workflow_ref, e.g. OWNER/REPO/.github/workflows/prod-release.yml@refs/heads/main.
      Adds a job_workflow_ref condition to the prod and release-reader trust (unverified against AWS; fails closed).

Conditions:
  IsNonprod: !Equals [!Ref AccountKind, nonprod]
  IsProd: !Equals [!Ref AccountKind, prod]
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
  PinWorkflow: !Not [!Equals [!Ref ProdJobWorkflowRef, ""]]

Rules:
  NonprodSubjects:
    RuleCondition: !Equals [!Ref AccountKind, nonprod]
    Assertions:
      - Assert: !Not [!Equals [!Ref DevSubject, ""]]
        AssertDescription: DevSubject is required for a nonprod account
      - Assert: !Not [!Equals [!Ref PreviewSubject, ""]]
        AssertDescription: PreviewSubject is required for a nonprod account
      - Assert: !Not [!Equals [!Ref ProdSubject, ""]]
        AssertDescription: ProdSubject is required for the nonprod release-reader role
  ProdSubjects:
    RuleCondition: !Equals [!Ref AccountKind, prod]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProdSubject, ""]]
        AssertDescription: ProdSubject is required for a prod account

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # ---------- nonprod: dev ----------
  DevDeployRole:
    Type: AWS::IAM::Role
    Condition: IsNonprod
    Properties:
      RoleName: apm-github-dev
      Path: /github/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [MakeProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref DevSubject
      Policies:
        - PolicyName: deploy-apm-dev
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DescribeStacks,
                         cloudformation:DescribeStackEvents, cloudformation:GetTemplate]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/apm-dev/*
              - Sid: StackRead
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: BrokerRole
                Effect: Allow
                Action: [iam:CreateRole, iam:GetRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:TagRole,
                         iam:UntagRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy,
                         iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-dev/apm-dev__broker
              - Sid: BrokerRoleManagedPolicy
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-dev/apm-dev__broker
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassBrokerRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-dev/apm-dev__broker
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: Boundary
                Effect: Allow
                Action: [iam:CreatePolicy, iam:GetPolicy, iam:GetPolicyVersion, iam:ListPolicyVersions,
                         iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:TagPolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-dev_agent-boundary
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:apm-dev
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:CreateTable, dynamodb:DescribeTable, dynamodb:UpdateTable,
                         dynamodb:DescribeContinuousBackups, dynamodb:UpdateContinuousBackups,
                         dynamodb:TagResource, dynamodb:UntagResource, dynamodb:ListTagsOfResource,
                         dynamodb:DescribeTimeToLive]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/apm-dev
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:DescribeLogGroups, logs:TagResource,
                         logs:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/apm-dev*
              - Sid: Secrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apm-dev/*
              - Sid: Artifacts # bundles, manifests and dev release records (write-once)
                Effect: Allow
                Action: [s3:CreateBucket, s3:PutBucketPublicAccessBlock, s3:ListBucket, s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-${AWS::AccountId}-${AWS::Region}/*
              - Sid: NeverProd
                Effect: Deny
                Action: "*"
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/apm/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/github/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agents/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-agent-boundary
                  - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:apm
                  - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/apm
                  - !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/apm/*
                  - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/apm:*
                  - !Sub arn:${AWS::Partition}:s3:::apm-artifacts-*
                  - !Sub arn:${AWS::Partition}:s3:::apm-preview-artifacts-*
              - Sid: Edge
                Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE,
                         acm:RequestCertificate, acm:DescribeCertificate,
                         acm:DeleteCertificate, acm:AddTagsToCertificate, acm:ListTagsForCertificate,
                         route53:ListHostedZonesByName, route53:GetHostedZone, route53:ChangeResourceRecordSets,
                         route53:ListResourceRecordSets, route53:GetChange]
                Resource: "*"

  # ---------- nonprod: previews (stages pr-<N>) ----------
  PreviewDeployRole:
    Type: AWS::IAM::Role
    Condition: IsNonprod
    Properties:
      RoleName: apm-github-preview
      Path: /github/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [MakeProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref PreviewSubject
      Policies:
        - PolicyName: deploy-apm-previews
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DeleteStack,
                         cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:GetTemplate]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/apm-pr-*/*
              - Sid: StackRead
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ValidateTemplate]
                Resource: "*"
              - Sid: BrokerRole
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:UpdateRole, iam:UpdateRoleDescription,
                         iam:TagRole, iam:UntagRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy,
                         iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-pr-*
              - Sid: BrokerRoleManagedPolicy
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-pr-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassBrokerRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-pr-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: Boundary
                Effect: Allow
                Action: [iam:CreatePolicy, iam:DeletePolicy, iam:GetPolicy, iam:GetPolicyVersion,
                         iam:ListPolicyVersions, iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:TagPolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-pr-*
              - Sid: TeardownAgentRoles
                Effect: Allow
                Action: [iam:ListRolePolicies, iam:DeleteRolePolicy, iam:ListAttachedRolePolicies,
                         iam:DetachRolePolicy, iam:DeleteRole]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agents-pr-*
              - Sid: ListRoles
                Effect: Allow
                Action: iam:ListRoles
                Resource: "*"
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:apm-pr-*
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:CreateTable, dynamodb:DeleteTable, dynamodb:DescribeTable, dynamodb:UpdateTable,
                         dynamodb:DescribeContinuousBackups, dynamodb:UpdateContinuousBackups,
                         dynamodb:TagResource, dynamodb:UntagResource, dynamodb:ListTagsOfResource,
                         dynamodb:DescribeTimeToLive]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/apm-pr-*
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DescribeLogGroups,
                         logs:TagResource, logs:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/apm-pr-*
              - Sid: Secrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter, ssm:GetParametersByPath, ssm:DeleteParameters]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apm-pr-*
              - Sid: SharedStagingWorkosKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apm-nonprod/workos-api-key
              - Sid: Artifacts # shared preview bucket only; objects expire (lifecycle set on creation)
                Effect: Allow
                Action: [s3:CreateBucket, s3:PutBucketPublicAccessBlock, s3:PutLifecycleConfiguration,
                         s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::apm-preview-artifacts-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::apm-preview-artifacts-${AWS::AccountId}-${AWS::Region}/*
              - Sid: NeverDevOrProd
                Effect: Deny
                Action: "*"
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/apm/*
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/apm-dev/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm-dev/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agents/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agents-dev/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/github/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-agent-boundary
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-dev_agent-boundary
                  - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:apm
                  - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:apm-dev
                  - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/apm
                  - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/apm-dev
                  - !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/apm/*
                  - !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/apm-dev/*
                  - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/apm:*
                  - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/apm-dev:*
                  - !Sub arn:${AWS::Partition}:s3:::apm-artifacts-*
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-*
              - Sid: Edge
                Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE,
                         acm:DescribeCertificate, acm:ListTagsForCertificate,
                         route53:ListHostedZonesByName, route53:GetHostedZone, route53:ChangeResourceRecordSets,
                         route53:ListResourceRecordSets, route53:GetChange]
                Resource: "*"

  # ---------- nonprod: read-only access to dev releases, for the prod promotion workflow ----------
  ReleaseReaderRole:
    Type: AWS::IAM::Role
    Condition: IsNonprod
    Properties:
      RoleName: apm-github-release-reader
      Path: /github/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [MakeProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Condition: !If
              - PinWorkflow
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !Ref ProdSubject
                  token.actions.githubusercontent.com:job_workflow_ref: !Ref ProdJobWorkflowRef
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !Ref ProdSubject
      Policies:
        - PolicyName: read-apm-dev-releases
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDevReleases
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-${AWS::AccountId}-${AWS::Region}/releases/dev/*
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-${AWS::AccountId}-${AWS::Region}/lambda/*
                  - !Sub arn:${AWS::Partition}:s3:::apm-dev-artifacts-${AWS::AccountId}-${AWS::Region}/manifests/*

  # ---------- prod ----------
  ProdDeployRole:
    Type: AWS::IAM::Role
    Condition: IsProd
    Properties:
      RoleName: apm-github-prod
      Path: /github/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [MakeProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Condition: !If
              - PinWorkflow
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !Ref ProdSubject
                  token.actions.githubusercontent.com:job_workflow_ref: !Ref ProdJobWorkflowRef
              - StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                  token.actions.githubusercontent.com:sub: !Ref ProdSubject
      Policies:
        - PolicyName: deploy-apm-prod
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Update-only: no stack, table, role or log group deletion. A change that needs a
              # replacement fails here and goes through the owner's `apm-admin deploy` instead.
              - Sid: Stack
                Effect: Allow
                Action: [cloudformation:UpdateStack, cloudformation:DescribeStacks,
                         cloudformation:DescribeStackEvents, cloudformation:GetTemplate]
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/apm/*
              - Sid: StackRead
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: BrokerRole
                Effect: Allow
                Action: [iam:GetRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:TagRole, iam:UntagRole,
                         iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy, iam:ListRolePolicies,
                         iam:ListAttachedRolePolicies]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm/apm-broker
              - Sid: PassBrokerRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/apm/apm-broker
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: Boundary
                Effect: Allow
                Action: [iam:GetPolicy, iam:GetPolicyVersion, iam:ListPolicyVersions, iam:CreatePolicyVersion,
                         iam:DeletePolicyVersion, iam:TagPolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/apm-agent-boundary
              - Sid: Function
                Effect: Allow
                Action: [lambda:Get*, lambda:List*, lambda:UpdateFunctionCode,
                         lambda:UpdateFunctionConfiguration, lambda:TagResource,
                         lambda:UntagResource, lambda:GetPolicy, lambda:AddPermission, lambda:RemovePermission]
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:apm
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:DescribeTable, dynamodb:UpdateTable, dynamodb:DescribeContinuousBackups,
                         dynamodb:UpdateContinuousBackups, dynamodb:TagResource, dynamodb:ListTagsOfResource,
                         dynamodb:DescribeTimeToLive]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/apm
              - Sid: Logs
                Effect: Allow
                Action: [logs:PutRetentionPolicy, logs:DescribeLogGroups, logs:TagResource, logs:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/apm*
              - Sid: Secrets
                Effect: Allow
                Action: ssm:GetParameter # read-only: prod secrets already exist and are owner-managed
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/apm/*
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::apm-artifacts-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::apm-artifacts-${AWS::AccountId}-${AWS::Region}/*
              - Sid: Edge
                Effect: Allow
                Action: [apigateway:GET, apigateway:PUT, apigateway:PATCH, apigateway:POST, acm:DescribeCertificate,
                         acm:ListTagsForCertificate, route53:ListHostedZonesByName, route53:GetHostedZone,
                         route53:ListResourceRecordSets, route53:GetChange]
                Resource: "*"

Outputs:
  DevRoleArn:
    Condition: IsNonprod
    Value: !GetAtt DevDeployRole.Arn
    Description: repository variable APM_DEV_ROLE_ARN
  PreviewRoleArn:
    Condition: IsNonprod
    Value: !GetAtt PreviewDeployRole.Arn
    Description: repository variable APM_PREVIEW_ROLE_ARN
  ReleaseReaderRoleArn:
    Condition: IsNonprod
    Value: !GetAtt ReleaseReaderRole.Arn
    Description: repository variable APM_RELEASE_READER_ROLE_ARN
  ProdRoleArn:
    Condition: IsProd
    Value: !GetAtt ProdDeployRole.Arn
    Description: repository variable APM_PROD_ROLE_ARN
