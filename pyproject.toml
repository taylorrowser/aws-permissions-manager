[project]
name = "aws-permissions-manager"
version = "0.1.0"
description = "Agents request scoped AWS permissions per project; the owner approves them in a hosted dashboard."
requires-python = ">=3.11"
dependencies = ["boto3[crt]>=1.40", "cryptography>=43"]

[project.scripts]
apm-admin = "apm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apm"]

[tool.setuptools.package-data]
apm = ["static/*", "lambda-requirements.txt"]
